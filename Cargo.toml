[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/icarojobs/orderflow-rs"
authors = ["Icaro William <icarojobsoficial@gmail.com>"]

[workspace.dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters"] }
proptest = "1"
slab = "0.4"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
