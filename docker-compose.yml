name: orderflow

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      target: gateway
    image: orderflow/gateway:local
    environment:
      RUST_LOG: info,rskafka=warn
      GATEWAY_SYMBOLS: BTC-USD,ETH-USD
      GATEWAY_GRPC_ADDR: 0.0.0.0:50051
      GATEWAY_HTTP_ADDR: 0.0.0.0:8080
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: orderflow.events
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "${GATEWAY_GRPC_PORT:-50051}:50051"
      - "${GATEWAY_HTTP_PORT:-18080}:8080"
    stop_grace_period: 10s
    restart: unless-stopped

  market-data:
    build:
      context: .
      target: market-data
    image: orderflow/market-data:local
    environment:
      RUST_LOG: info,rskafka=warn
      MD_HTTP_ADDR: 0.0.0.0:8081
      MD_START_FROM: latest
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: orderflow.events
    ports:
      - "${MARKET_DATA_PORT:-18081}:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped

  # Toolchain container for running cargo inside Docker:
  #   docker compose run --rm dev cargo test --workspace
  dev:
    profiles: [dev]
    build:
      context: .
      target: toolchain
    image: orderflow/toolchain:local
    # Runs as the host user and keeps cargo caches under ./target/docker, so
    # nothing root-owned lands in the repo and no named volumes are needed.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      CARGO_HOME: /src/target/docker/cargo
      CARGO_TARGET_DIR: /src/target/docker/build
    volumes:
      - .:/src
